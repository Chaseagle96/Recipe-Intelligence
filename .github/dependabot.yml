version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "actions/*"
      codeql:
        patterns:
          - "github/codeql-action/*"
    labels:
      - dependencies
