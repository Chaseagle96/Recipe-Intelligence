name: Recipe Intelligence Authority Self-Heal

on:
  workflow_run:
    workflows:
      - Recipe Intelligence Authority Invalidation
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-self-heal.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: recipe-intelligence-authority-self-heal-main
  cancel-in-progress: true

jobs:
  heal:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current production state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Restore any non-authoritative vertical
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          has_active_run() {
            local workflow="$1"
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch main \
              --limit 20 \
              --json status \
              --jq 'any(.[]; .status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")'
          }

          dispatch_if_stale() {
            local vertical="$1"
            local workflow="$2"
            local label="$3"
            local decision

            decision=$(PYTHONPATH=src python -m airfryer_rankings.ops authority-decision \
              --vertical "$vertical" --recovery)
            if [ "$decision" = "noop" ]; then
              echo "$label authority is current."
              return
            fi

            if [ "$(has_active_run "$workflow")" = "true" ]; then
              echo "$label is non-authoritative, but a ranking run is already active."
              return
            fi

            echo "$label is non-authoritative. Dispatching a full daily recovery refresh."
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily
          }

          dispatch_if_stale air-fryer hourly.yml 'Air Fryer'
          dispatch_if_stale slow-cooker slow-cooker.yml 'Slow Cooker'
