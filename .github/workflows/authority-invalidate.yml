name: Recipe Intelligence Authority Invalidation

on:
  workflow_run:
    workflows:
      - Recipe Intelligence Source Expansion
      - Recipe Intelligence Source Catalog Sync
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-invalidate.yml'
      - '.github/workflows/authoritative-refresh.yml'
      - '.github/workflows/authority-postcheck.yml'
      - 'src/airfryer_rankings/authority.py'
      - 'scripts/ranking_authority.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: recipe-intelligence-authority-invalidate-main
  cancel-in-progress: false

jobs:
  invalidate:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current production state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Evaluate authority invalidation for each vertical
        run: |
          for vertical in air-fryer slow-cooker; do
            PYTHONPATH=src python -m airfryer_rankings.ops invalidate-authority \
              --vertical "$vertical" \
              --reason source_or_catalog_generation_advanced
          done

      - name: Commit authority invalidation when needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            output/summary.json \
            output/authority.json \
            docs/api/manifest.json \
            docs/api/authority.json \
            docs/index.html \
            verticals/slow_cooker/output/summary.json \
            verticals/slow_cooker/output/authority.json \
            verticals/slow_cooker/docs/api/manifest.json \
            verticals/slow_cooker/docs/api/authority.json \
            verticals/slow_cooker/docs/index.html; do
            [ ! -e "$file" ] || git add "$file"
          done
          if ! git diff --quiet; then
            echo 'Unexpected unstaged tracked changes remain after authority invalidation staging:' >&2
            git status --short >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'Serving authority already reflects current input generation.'
          else
            git commit -m 'Invalidate stale recipe ranking authority'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch full ranking refresh after invalidation
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.name == 'Recipe Intelligence Source Catalog Sync' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run hourly.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily
          gh workflow run slow-cooker.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily
          echo 'Full Air Fryer and Slow Cooker ranking refreshes dispatched after authority invalidation completed.'

      - name: Explain source-expansion-only invalidation
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Recipe Intelligence Source Expansion'
        run: >-
          echo 'Authority was invalidated after source expansion. The full ranking refresh will be dispatched by the subsequent successful Source Catalog Sync invalidation run.'
