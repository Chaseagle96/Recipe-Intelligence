name: Mobile Corpus Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-corpus-backfill.yml'

permissions:
  contents: read

jobs:
  backfill:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - vertical: air-fryer
            manifest: docs/api/manifest.json
            docs: docs/api
          - vertical: slow-cooker
            manifest: verticals/slow_cooker/docs/api/manifest.json
            docs: verticals/slow_cooker/docs/api
    concurrency:
      group: recipe-intelligence-${{ matrix.vertical }}-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Backfill mobile corpus from existing state
        shell: bash
        run: |
          if [ "${{ matrix.vertical }}" = "air-fryer" ]; then
            PYTHONPATH=src python scripts/backfill_mobile_corpus.py
          else
            cd verticals/slow_cooker
            RECIPE_INTELLIGENCE_VERTICAL='Slow Cooker' \
            RECIPE_INTELLIGENCE_VERTICAL_SLUG='slow_cooker' \
            PYTHONPATH=../../src \
            python ../../scripts/backfill_mobile_corpus.py \
              --sources ../../config/verticals/slow_cooker/sources.yaml
          fi

      - name: Validate corpus manifests without crawling
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['MANIFEST'])
          payload = json.loads(path.read_text(encoding='utf-8'))
          ranked = int(payload['ranked_recipe_count'])
          corpus = int(payload['corpus_recipe_count'])
          assert corpus >= ranked, (path, ranked, corpus)
          assert sum(int(page['count']) for page in payload['pages']) == ranked
          assert sum(int(page['count']) for page in payload['corpus_pages']) == corpus
          assert payload['corpus_status_counts'].get('discover', 0) == ranked
          print(path, 'ranked=', ranked, 'corpus=', corpus, 'statuses=', payload['corpus_status_counts'])
          PY

      - name: Commit generated corpus feeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${{ matrix.docs }}"
          if git diff --cached --quiet; then
            echo 'Mobile corpus feeds are already current.'
            exit 0
          fi
          git commit -m 'Backfill ${{ matrix.vertical }} mobile recipe corpus'
          git pull --rebase origin main
          git push origin HEAD:main
