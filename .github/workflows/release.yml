name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semantic X.Y.Z, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify model semantic version matches release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          payload = yaml.safe_load(Path("config/model.yaml").read_text(encoding="utf-8")) or {}
          model_semver = str(payload.get("model_semver") or "")
          release_version = os.environ["RELEASE_VERSION"]
          if model_semver != release_version:
              raise SystemExit(
                  f"config/model.yaml model_semver={model_semver!r} does not match VERSION={release_version!r}"
              )
          PY

      - name: Create GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          existing_target=''
          if git rev-parse --verify --quiet "$TAG^{commit}" >/dev/null; then
            existing_target="$(git rev-parse "$TAG^{commit}")"
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG targets $existing_target, expected $GITHUB_SHA." >&2
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -z "$existing_target" ]; then
              echo "Release $TAG exists, but its tag is unavailable after a full tag fetch." >&2
              exit 1
            fi
            echo "Release $TAG already exists at expected commit $GITHUB_SHA."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            config/model.yaml \
            config/slo.yaml \
            CHANGELOG.md
