name: Recipe Intelligence — Slow Cooker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/slow-cooker.yml'
      - '.github/workflows/_vertical-refresh.yml'
      - '.github/workflows/_vertical-validate.yml'
      - 'src/**'
      - 'tests/**'
      - 'config/verticals/slow_cooker/**'
      - 'config/slo.yaml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'verticals/slow_cooker/data/benchmarks/**'
  schedule:
    - cron: '31 * * * *'
    - cron: '7 9 * * *'
    - cron: '37 9 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Slow Cooker refresh mode
        required: true
        default: deep
        type: choice
        options: [hourly, daily, deep, backfill]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/slow-cooker.yml'
      - '.github/workflows/_vertical-refresh.yml'
      - '.github/workflows/_vertical-validate.yml'
      - 'src/**'
      - 'tests/**'
      - 'config/verticals/slow_cooker/**'
      - 'config/slo.yaml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'verticals/slow_cooker/data/benchmarks/**'

permissions:
  contents: read

# Slow Cooker mutations are independent from Air Fryer and source-discovery state.
# Pull-request validation remains isolated per ref and is never granted write access.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'recipe-intelligence-slow-cooker-state' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/_vertical-validate.yml
    with:
      vertical: slow-cooker

  refresh:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/_vertical-refresh.yml
    with:
      vertical: slow-cooker
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '7 9 * * *' && 'daily' || github.event.schedule == '37 9 * * 0' && 'deep' || 'hourly' }}
      production: true
