name: Recipe Intelligence iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'api/verticals.json'
      - 'src/airfryer_rankings/app_feed.py'
      - 'src/airfryer_rankings/dashboard.py'
      - 'src/airfryer_rankings/ranking.py'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'api/verticals.json'
      - 'src/airfryer_rankings/app_feed.py'
      - 'src/airfryer_rankings/dashboard.py'
      - 'src/airfryer_rankings/ranking.py'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode environment
        run: |
          XCODE_VERSION="$(xcodebuild -version | head -n 1)"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            "Xcode 26"*) ;;
            *) echo "Expected Xcode 26 runner, got: $XCODE_VERSION" >&2; exit 1 ;;
          esac
          xcodebuild -project ios/RecipeIntelligence.xcodeproj -list

      - name: Build iOS simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/RecipeIntelligence.xcodeproj \
            -scheme RecipeIntelligence \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(f"udid={device['udid']}")
                      print(f"name={device['name']}")
                      raise SystemExit
          raise SystemExit("No available iPhone simulator found")
          PY

      - name: Run unit and UI tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcodebuild \
            -project ios/RecipeIntelligence.xcodeproj \
            -scheme RecipeIntelligence \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          rm -rf ios/build-device
          xcodebuild \
            -project ios/RecipeIntelligence.xcodeproj \
            -scheme RecipeIntelligence \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='ios/build-device/Build/Products/Release-iphoneos/RecipeIntelligence.app'
          test -d "$APP_PATH"
          rm -rf ios/ipa-staging ios/RecipeIntelligence.ipa
          mkdir -p ios/ipa-staging/Payload
          ditto "$APP_PATH" ios/ipa-staging/Payload/RecipeIntelligence.app
          (
            cd ios/ipa-staging
            /usr/bin/zip -qry ../RecipeIntelligence.ipa Payload
          )
          test -s ios/RecipeIntelligence.ipa
          /usr/bin/unzip -l ios/RecipeIntelligence.ipa | grep 'Payload/RecipeIntelligence.app/Info.plist'
          echo "IPA size: $(du -h ios/RecipeIntelligence.ipa | cut -f1)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RecipeIntelligence-unsigned-ipa
          retention-days: 30
          if-no-files-found: error
          path: ios/RecipeIntelligence.ipa
