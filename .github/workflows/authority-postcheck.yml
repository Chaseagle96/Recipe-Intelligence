name: Recipe Intelligence Authority Postcheck

on:
  # zizmor: ignore[dangerous-triggers] workflow_run is gated to successful same-repository main pushes below.
  workflow_run:
    workflows:
      - Recipe Intelligence
      - Recipe Intelligence — Slow Cooker
    types: [completed]
  workflow_dispatch:
    inputs:
      vertical:
        description: Ranking vertical to certify
        required: true
        default: air_fryer
        type: choice
        options:
          - air_fryer
          - slow_cooker

permissions:
  contents: read

jobs:
  certify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: recipe-intelligence-${{ github.event_name == 'workflow_dispatch' && inputs.vertical == 'slow_cooker' && 'slow-cooker' || github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Recipe Intelligence — Slow Cooker' && 'slow-cooker' || 'air-fryer' }}-state
      cancel-in-progress: false
    steps:
      - name: Checkout current production state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Resolve vertical
        id: vertical
        env:
          INPUT_VERTICAL: ${{ inputs.vertical }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          vertical="$INPUT_VERTICAL"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            case "$WORKFLOW_NAME" in
              "Recipe Intelligence") vertical=air_fryer ;;
              "Recipe Intelligence — Slow Cooker") vertical=slow_cooker ;;
              *) echo 'Unsupported ranking workflow'; exit 1 ;;
            esac
          fi
          echo "vertical=$vertical" >> "$GITHUB_OUTPUT"
          echo "Certifying vertical: $vertical"

      - name: Check whether current main still matches completed ranking
        id: freshness
        if: github.event_name == 'workflow_run'
        env:
          VERTICAL: ${{ steps.vertical.outputs.vertical }}
        shell: bash
        run: |
          result="$(PYTHONPATH=src python -m airfryer_rankings.ops authority-decision \
            --vertical "$VERTICAL")"
          printf '%s\n' "$result"
          decision="$(jq -r '.decision' <<<"$result")"
          ranking_current="$(jq -r '.ranking_current' <<<"$result")"
          if [ "$decision" = "noop" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "Current main matches the completed $VERTICAL ranking generation."
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping authority postcheck: decision=$decision ranking_current=$ranking_current. A newer source/catalog generation or incomplete refresh already advanced main."
          fi

      - name: Certify Air Fryer serving generation
        if: >-
          steps.vertical.outputs.vertical == 'air_fryer' &&
          (github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true')
        run: |
          PYTHONPATH=src python scripts/ranking_authority.py publish \
            --vertical air_fryer \
            --sources config/sources.yaml \
            --state data/state.json \
            --registry data/source_registry.json \
            --metrics output/source_expansion.json \
            --summary output/summary.json \
            --leaderboard output/leaderboard.csv \
            --authority output/authority.json \
            --public-authority docs/api/authority.json \
            --manifest docs/api/manifest.json

      - name: Certify Slow Cooker serving generation
        if: >-
          steps.vertical.outputs.vertical == 'slow_cooker' &&
          (github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true')
        run: |
          PYTHONPATH=src python scripts/ranking_authority.py publish \
            --vertical slow_cooker \
            --sources config/verticals/slow_cooker/sources.yaml \
            --state verticals/slow_cooker/data/state.json \
            --registry verticals/slow_cooker/data/source_registry.json \
            --metrics verticals/slow_cooker/output/source_expansion.json \
            --summary verticals/slow_cooker/output/summary.json \
            --leaderboard verticals/slow_cooker/output/leaderboard.csv \
            --authority verticals/slow_cooker/output/authority.json \
            --public-authority verticals/slow_cooker/docs/api/authority.json \
            --manifest verticals/slow_cooker/docs/api/manifest.json

      - name: Commit certified serving generation
        if: >-
          github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        env:
          VERTICAL: ${{ steps.vertical.outputs.vertical }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$VERTICAL" = "air_fryer" ]; then
            for file in output/summary.json output/authority.json docs/api/manifest.json docs/api/authority.json; do
              [ ! -e "$file" ] || git add "$file"
            done
          else
            for file in \
              verticals/slow_cooker/output/summary.json \
              verticals/slow_cooker/output/authority.json \
              verticals/slow_cooker/docs/api/manifest.json \
              verticals/slow_cooker/docs/api/authority.json; do
              [ ! -e "$file" ] || git add "$file"
            done
          fi
          if git diff --cached --quiet; then
            echo 'Authority generation already certified.'
            exit 0
          fi
          git commit -m "Certify $VERTICAL ranking authority"
          git pull --rebase origin main
          git push origin HEAD:main
