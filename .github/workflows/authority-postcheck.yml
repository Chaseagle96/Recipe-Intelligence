name: Recipe Intelligence Authority Postcheck

on:
  workflow_run:
    workflows:
      - Recipe Intelligence
      - Recipe Intelligence — Slow Cooker
    types: [completed]
  workflow_dispatch:
    inputs:
      vertical:
        description: Ranking vertical to certify
        required: true
        default: air_fryer
        type: choice
        options:
          - air_fryer
          - slow_cooker

permissions:
  contents: write

concurrency:
  group: recipe-intelligence-authority-publish-main
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current production state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Resolve vertical
        id: vertical
        shell: bash
        run: |
          vertical="${{ inputs.vertical }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            case "${{ github.event.workflow_run.name }}" in
              "Recipe Intelligence") vertical=air_fryer ;;
              "Recipe Intelligence — Slow Cooker") vertical=slow_cooker ;;
              *) echo 'Unsupported ranking workflow'; exit 1 ;;
            esac
          fi
          echo "vertical=$vertical" >> "$GITHUB_OUTPUT"
          echo "Certifying vertical: $vertical"

      - name: Check whether current main still matches completed ranking
        id: freshness
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          VERTICAL: ${{ steps.vertical.outputs.vertical }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          vertical = os.environ['VERTICAL']
          if vertical == 'air_fryer':
              state_path = Path('data/state.json')
              summary_path = Path('output/summary.json')
              metrics_path = Path('output/source_expansion.json')
          else:
              state_path = Path('verticals/slow_cooker/data/state.json')
              summary_path = Path('verticals/slow_cooker/output/summary.json')
              metrics_path = Path('verticals/slow_cooker/output/source_expansion.json')

          state = json.loads(state_path.read_text(encoding='utf-8'))
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          metrics = json.loads(metrics_path.read_text(encoding='utf-8'))
          current_catalog = len(state.get('url_catalog', {}) or {})
          summary_catalog = int(summary.get('catalog_urls') or 0)

          def dt(value):
              return datetime.fromisoformat(str(value).replace('Z', '+00:00')) if value else None

          ranking_at = dt(summary.get('generated_at'))
          catalog_sync_at = dt(metrics.get('catalog_sync_generated_at'))
          current = summary_catalog == current_catalog and ranking_at is not None and catalog_sync_at is not None and ranking_at >= catalog_sync_at
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"current={'true' if current else 'false'}\n")
          if current:
              print(f'Current main still matches completed {vertical} ranking generation.')
          else:
              print(f'::notice::Skipping stale postcheck for {vertical}: summary catalog={summary_catalog}, current catalog={current_catalog}, ranking_at={ranking_at}, catalog_sync_at={catalog_sync_at}. A newer source/catalog generation already advanced main.')
          PY

      - name: Certify serving generation
        if: >-
          github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        run: |
          PYTHONPATH=src python -m airfryer_rankings.ops publish-authority \
            --vertical "${{ steps.vertical.outputs.vertical }}"

      - name: Commit certified serving generation
        if: >-
          github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.vertical.outputs.vertical }}" = "air_fryer" ]; then
            for file in output/summary.json output/authority.json docs/api/manifest.json docs/api/authority.json; do
              [ ! -e "$file" ] || git add "$file"
            done
          else
            for file in \
              verticals/slow_cooker/output/summary.json \
              verticals/slow_cooker/output/authority.json \
              verticals/slow_cooker/docs/api/manifest.json \
              verticals/slow_cooker/docs/api/authority.json; do
              [ ! -e "$file" ] || git add "$file"
            done
          fi
          if git diff --cached --quiet; then
            echo 'Authority generation already certified.'
            exit 0
          fi
          git commit -m "Certify ${{ steps.vertical.outputs.vertical }} ranking authority"
          git pull --rebase origin main
          git push origin HEAD:main
