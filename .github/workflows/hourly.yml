name: Recipe Intelligence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hourly.yml'
      - '.github/workflows/_vertical-refresh.yml'
      - '.github/workflows/_vertical-validate.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'data/benchmarks/**'
  schedule:
    - cron: '17 */6 * * *'
    - cron: '43 8 * * *'
    - cron: '13 9 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode
        required: true
        default: deep
        type: choice
        options: [hourly, daily, deep, backfill]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Air Fryer mutations are independent from Slow Cooker and source-discovery state.
# Pull-request validation remains isolated per ref and is never granted write access.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'recipe-intelligence-air-fryer-state' }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/_vertical-validate.yml
    with:
      vertical: air-fryer

  refresh:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/_vertical-refresh.yml
    with:
      vertical: air-fryer
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '43 8 * * *' && 'daily' || github.event.schedule == '13 9 * * 0' && 'deep' || 'hourly' }}
      production: true
